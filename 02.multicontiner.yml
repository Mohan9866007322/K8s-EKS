apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
  labels:
    app: multi-container
spec:
  containers:
    - name: app-container
      image: nginx:alpine
      ports:
        - containerPort: 80

    - name: sidecar-container
      image: busybox:1.36
      command: ['sh', '-c', 'while true; do echo "Sidecar running..."; sleep 10; done']