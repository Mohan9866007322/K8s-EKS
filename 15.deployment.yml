apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx                  # Best practice: keep metadata names lowercase
  labels:
    purpose: deployment-demon
    project: ecom
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      purpose: deployment-demon
      project: ecom
      app: nginx
  template:
    metadata:            
      labels:
        purpose: deployment-demon
        project: ecom
        app: nginx
    spec:               
      containers:             
        - name: nginx
          image: nginx:stable-perl