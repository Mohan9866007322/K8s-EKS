apiVersion: v1
kind: Pod
metadata:
  name: resourceslimit
labels:
    app: nginix
    tire: frontend
spec:
  containers:
    name: nginx
    image: nginx
    resources:
      limits:  #hard limit
        memory: "128Mi"
        cpu: "200m"
      requests: #soft limit
        memory: "64Mi"
        cpu: "150m"
