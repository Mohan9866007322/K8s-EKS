apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  labels:
    purpose: service-demon
spec:
  selector:
    purpose: service-demon
    project: ecom
    environment: Dev
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
    
---
apiVersion: v1
kind: Pod
metadata:
  name: nginix
  labels:
    purpose: service-demon
    project: ecom
    environment: Dev
spec:
  containers:
    - name: mysecret-container
      image: nginx
