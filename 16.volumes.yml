apiVersion: v1
kind: PersistentVolume
metadata:
  name: test-pv
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 2Gi
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-01871ca0e67fa4752  # will change based on the volume created in aws console
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-pvc-1
spec:
  storageClassName: "" # Empty string must be explicitly set otherwise default StorageClass will be set
  volumeName: test-pv  # CORRECTED: Changed from ebs-pv-1 to match the PV name above
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
    purpose: demonstrate-ebs-csi
    project: ebs-csi
spec:
  nodeSelector:
    topology.kubernetes.io/zone: usw2-az2 (us-west-2a)  # CORRECTED: Changed '=' to ':' 
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - mountPath: "/usr/share/nginx/html"
      name: ebs-volume
  volumes:
  - name: ebs-volume
    persistentVolumeClaim:
      claimName: ebs-pvc-1
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-lb
  labels:
    purpose: demonstrate-ebs-csi
    project: ebs-csi
spec:
  type: LoadBalancer
  selector:
    purpose: demonstrate-ebs-csi
    project: ebs-csi
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80 