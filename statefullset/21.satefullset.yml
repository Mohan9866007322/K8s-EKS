apiVersion: v1
kind: Service
metadata:
  name: sc-headless-svc
  labels:
    purpose: demonstrate-statefulset
    project: statefulset-demo
spec:
  clusterIP: None
  selector:
    purpose: demonstrate-statefulset
    project: statefulset-demo
  ports:
  - port: 80
    name: web
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nginx
spec:
  serviceName: "sc-headless-svc"
  replicas: 2
  selector:
    matchLabels:
      purpose: demonstrate-statefulset
      project: statefulset-demo
  template:
    metadata:
      labels:
        purpose: demonstrate-statefulset
        project: statefulset-demo
    spec:
      containers:
      - name: nginx
        image: nginx
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "ebs-sc"
      resources:
        requests:
          storage: 1Gi
  